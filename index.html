<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 照片墙 v2</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; height: 100vh; width: 100vw; user-select: none; }
#container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
.overlay { position: fixed; top: 15%; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none; text-align: center; }
.overlay .title { font-size: clamp(1.6rem, 4vw, 2.8rem); color: #ffffff; text-shadow: 0 0 20px rgba(255,105,180,0.6), 0 0 40px rgba(255,105,180,0.3); letter-spacing: 0.12em; margin-bottom: 0.6rem; font-weight: bold; }
.overlay .subtitle { font-size: clamp(0.85rem, 2vw, 1.1rem); color: rgba(255,255,255,0.55); letter-spacing: 0.15em; }
.controls { display: none; }
.hint { display: none; }
</style>
</head>
<body>
<audio id="bgMusic" src="music.mp3" loop></audio>
<div id="container"></div>
<div class="overlay">
        <div class="title">命运的抉择</div>
        <div class="subtitle">是注定的</div>
</div>
<div class="hint" id="layoutHint">当前布局: 网格平铺 | 点击屏幕切换 | 拖拽旋转 | 滚轮缩放</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script>
console.log("[3D] Script start");

(function () {
    "use strict";
    console.log("[3D] IIFE start");

    var container = document.getElementById("container");
    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a10);
    scene.fog = new THREE.Fog(0x0a0a10, 25, 75);

    var camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 4, 55);
    camera.lookAt(0, 0, 0);

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a0a10);
    container.appendChild(renderer.domElement);

    var ambientLight = new THREE.AmbientLight(0x404060, 1.0);
    scene.add(ambientLight);
    var dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);
    var pinkLight = new THREE.PointLight(0xff6699, 0.5, 40);
    pinkLight.position.set(-10, 6, 10);
    scene.add(pinkLight);
    var blueLight = new THREE.PointLight(0x6699ff, 0.4, 40);
    blueLight.position.set(10, -4, -10);
    scene.add(blueLight);

    var orbitControls = new THREE.OrbitControls(camera, renderer.domElement);
    orbitControls.target.set(0, 0, 0);
    orbitControls.enableDamping = true;
    orbitControls.dampingFactor = 0.08;
    orbitControls.autoRotate = false;
    orbitControls.autoRotateSpeed = 0.4;
    orbitControls.minDistance = 8;
    orbitControls.maxDistance = 70;
    orbitControls.maxPolarAngle = Math.PI * 0.8;
    orbitControls.update();

    var raycaster = new THREE.Raycaster();
    var mouse = new THREE.Vector2();
    var enlargedCard = null;
    var enlargedCardData = null;

    function createHeartSprite() {
        var size = 64;
        var canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        var cx = size / 2, cy = 28, scl = 1.1;
        for (var t = 0; t <= Math.PI * 2; t += 0.02) {
            var hx = 16 * Math.pow(Math.sin(t), 3);
            var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            var px = cx + hx * scl, py = cy + hy * scl;
            if (t === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        return new THREE.CanvasTexture(canvas);
    }

    var heartTexture = createHeartSprite();
    var heartCount = 200;
    var heartGeo = new THREE.BufferGeometry();
    var heartPositions = new Float32Array(heartCount * 3);
    heartGeo.setAttribute("position", new THREE.BufferAttribute(heartPositions, 3));
    var heartMat = new THREE.PointsMaterial({
        map: heartTexture, color: 0xff7799, size: 1.0,
        blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55
    });
    var hearts = new THREE.Points(heartGeo, heartMat);
    scene.add(hearts);

    var heartData = [];
    for (var i = 0; i < heartCount; i++) {
        heartData.push({
            baseX: (Math.random() - 0.5) * 55, baseZ: (Math.random() - 0.5) * 55,
            y: (Math.random() - 0.5) * 45, speed: 0.3 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2, amp: 0.6 + Math.random() * 3.5
        });
    }

    function createCardTexture(index) {
        var w = 300, h = 400;
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        var hue = (index * 37 + 180) % 360;
        var grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, "hsl(" + hue + ", 55%, 28%)");
        grad.addColorStop(0.55, "hsl(" + hue + ", 40%, 14%)");
        grad.addColorStop(1, "hsl(" + hue + ", 30%, 6%)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 2;
        ctx.strokeRect(3, 3, w - 6, h - 6);
        var phX = 20, phY = 20, phW = w - 40, phH = 280;
        ctx.fillStyle = "hsla(" + hue + ", 50%, 40%, 0.7)";
        ctx.fillRect(phX, phY, phW, phH);
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.beginPath();
        ctx.arc(w / 2, phY + phH / 2 - 15, 55, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.55)";
        ctx.font = "bold 26px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("照片", w / 2, phY + phH / 2 + 5);
        ctx.font = "bold 36px sans-serif";
        ctx.fillText(String(index + 1), w / 2, phY + phH / 2 + 48);
        var txtY = phY + phH + 10;
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(phX, txtY, phW, h - txtY - 20);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("我们的回忆", w / 2, txtY + 28);
        ctx.font = "12px sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        var month = Math.floor(index / 5) + 1;
        var day = (index % 28) + 1;
        ctx.fillText("2025." + month + "." + day, w / 2, txtY + 52);
        return new THREE.CanvasTexture(canvas);
    }

    var imagePaths = [];
    var cardCount = 35;
    var cards = [];

    for (var ci = 0; ci < cardCount; ci++) {
        var tex = createCardTexture(ci);
        tex.encoding = THREE.sRGBEncoding;
        var mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.35, metalness: 0.05, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        var geo = new THREE.PlaneGeometry(2.5, 3.35);
        var card = new THREE.Mesh(geo, mat);
        var edgeGeo = new THREE.EdgesGeometry(geo);
        var edgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.45 });
        card.add(new THREE.LineSegments(edgeGeo, edgeMat));
        card.userData = {
            index: ci, pos: { x: 0, y: 0, z: 0 }, rot: { x: 0, y: 0, z: 0 },
            phase: Math.random() * Math.PI * 2, speed: 0.5 + Math.random() * 1.2
        };
        if (imagePaths[ci]) {
            (function (cardMesh, path) {
                var img = new Image();
                img.onload = function () {
                    var realTex = new THREE.Texture(img);
                    realTex.encoding = THREE.sRGBEncoding;
                    realTex.needsUpdate = true;
                    cardMesh.material.map.dispose();
                    cardMesh.material.map = realTex;
                    cardMesh.material.needsUpdate = true;
                };
                img.src = path;
            })(card, imagePaths[ci]);
        }
        scene.add(card);
        cards.push(card);
    }

    var COLS = 7, ROWS = 5, SPC_X = 3.5, SPC_Y = 4.5;

    function gridLayout() {
        var result = [];
        for (var i = 0; i < cardCount; i++) {
            var col = i % COLS, row = Math.floor(i / COLS);
            result.push({ x: (col - (COLS - 1) / 2) * SPC_X, y: (row - (ROWS - 1) / 2) * SPC_Y, z: 0, rotX: 0, rotY: 0, rotZ: 0 });
        }
        return result;
    }

    function helixLayout() {
        var R = 11, n = cardCount, result = [];
        for (var i = 0; i < n; i++) {
            var t = (i / (n - 1)) * Math.PI * 4;
            result.push({ x: R * Math.cos(t), y: (i / (n - 1)) * 30 - 15, z: R * Math.sin(t), rotX: 0, rotY: Math.PI / 2 - t, rotZ: 0 });
        }
        return result;
    }

    function doubleHelixLayout() {
        var R = 11, n = cardCount, result = [];
        for (var i = 0; i < n; i++) {
            var phi = (i % 2 === 0) ? i * 0.35 + Math.PI : i * 0.35;
            result.push({ x: R * Math.cos(phi), y: (i / (n - 1)) * 30 - 15, z: R * Math.sin(phi), rotX: 0, rotY: Math.PI / 2 - phi, rotZ: 0 });
        }
        return result;
    }

    function pyramidLayout() {
        var result = [], currentLayer = 0, cardsInLayer = 1, countInCurrentLayer = 0;
        for (var i = 0; i < cardCount; i++) {
            if (countInCurrentLayer >= cardsInLayer) {
                currentLayer++;
                cardsInLayer = Math.max(1, currentLayer * 4);
                countInCurrentLayer = 0;
            }
            var y = 12 - currentLayer * 3.5, radius = currentLayer * 3.2;
            var phi = (countInCurrentLayer / Math.max(1, cardsInLayer)) * Math.PI * 2;
            result.push({ x: Math.cos(phi) * radius, y: y, z: Math.sin(phi) * radius, rotX: 0, rotY: Math.PI / 2 - phi, rotZ: 0 });
            countInCurrentLayer++;
        }
        return result;
    }

    function wave3dLayout() {
        var cols = Math.ceil(Math.sqrt(cardCount)), spc = 3.5, result = [];
        for (var i = 0; i < cardCount; i++) {
            var col = i % cols, row = Math.floor(i / cols);
            var x = (col - (cols - 1) / 2) * spc, z = (row - (cols - 1) / 2) * spc;
            var y = Math.sin(col * 0.5) * 2.8 + Math.cos(row * 0.5) * 2.8;
            result.push({ x: x, y: y, z: z, rotX: -Math.PI / 3, rotY: 0, rotZ: 0 });
        }
        return result;
    }

    function ringsLayout() {
        var n = cardCount, ringCount = 3, result = [];
        for (var i = 0; i < n; i++) {
            var ringIndex = i % ringCount, radius = 5 + ringIndex * 5.5;
            var countInRing = Math.floor(n / ringCount), posInRing = Math.floor(i / ringCount);
            var phi = (posInRing / Math.max(1, countInRing)) * Math.PI * 2;
            result.push({ x: Math.cos(phi) * radius, y: 0, z: Math.sin(phi) * radius, rotX: 0, rotY: Math.PI / 2 - phi, rotZ: 0 });
        }
        return result;
    }

    function waveLayout() {
        var result = [];
        for (var i = 0; i < cardCount; i++) {
            var col = i % COLS, row = Math.floor(i / COLS);
            var x = (col - (COLS - 1) / 2) * SPC_X, baseY = (row - (ROWS - 1) / 2) * SPC_Y;
            result.push({ x: x, y: baseY + Math.sin(x * 0.55) * 3.5, z: Math.sin(x * 0.45) * 6, rotX: Math.cos(x * 0.45) * 0.3, rotY: 0, rotZ: 0 });
        }
        return result;
    }

    function crossLayout() {
        var result = [];
        var halfV = Math.floor(cardCount / 2);
        var halfH = cardCount - halfV;
        for (var i = 0; i < halfV; i++) {
            var y = (i - (halfV - 1) / 2) * 0.9;
            result.push({
                x: (Math.random() - 0.5) * 0.3,
                y: y,
                z: (Math.random() - 0.5) * 0.4,
                rotX: 0, rotY: 0, rotZ: (Math.random() - 0.5) * 0.06
            });
        }
        for (var j = 0; j < halfH; j++) {
            var x = (j - (halfH - 1) / 2) * 0.9;
            result.push({
                x: x,
                y: (Math.random() - 0.5) * 0.3,
                z: (Math.random() - 0.5) * 0.4,
                rotX: 0, rotY: 0, rotZ: (Math.random() - 0.5) * 0.06
            });
        }
        return result;
    }

    function pokerLayout() {
        var result = [];
        for (var i = 0; i < cardCount; i++) {
            var t = i * 0.25;
            var sx = Math.sin(t);
            result.push({
                x: sx * 8,
                y: Math.sin(t * 0.7) * 3 + (i - 17) * 0.15,
                z: 5 + sx * sx * 9 + i * 0.04,
                rotX: Math.sin(t * 0.5) * 0.2,
                rotY: Math.cos(t) * 0.35,
                rotZ: Math.sin(t * 1.1) * 0.15
            });
        }
        return result;
    }

    function dragonLayout() {
        var R = 11;
        var result = [];
        for (var i = 0; i < cardCount; i++) {
            var theta = 0.2 + (Math.PI - 0.4) * (i / (cardCount - 1));
            result.push({
                x: R * Math.cos(theta),
                y: (Math.random() - 0.5) * 0.5,
                z: R * Math.sin(theta),
                rotX: (Math.random() - 0.5) * 0.04,
                rotY: -theta - Math.PI / 2,
                rotZ: (Math.random() - 0.5) * 0.04
            });
        }
        return result;
    }

    var layouts = {
        cross: crossLayout, grid: gridLayout, helix: helixLayout, doubleHelix: doubleHelixLayout,
        pyramid: pyramidLayout, wave3d: wave3dLayout, rings: ringsLayout, wave: waveLayout
    };

    var layoutNames = {
        cross: "3D十字架", grid: "网格平铺", helix: "圆环隧道", doubleHelix: "双螺旋",
        pyramid: "3D金字塔", wave3d: "3D大波浪", rings: "多层同心圆", wave: "波浪起伏"
    };

    function switchLayout(name, duration) {
        if (duration === undefined) duration = 1.4;
        console.log("[3D] switchLayout:", name);
        var targets = layouts[name]();
        var hintEl = document.getElementById("layoutHint");
        if (hintEl) hintEl.innerHTML = "当前布局: " + (layoutNames[name] || name) + " | 点击屏幕切换 | 拖拽旋转 | 滚轮缩放";
        for (var i = 0; i < cards.length; i++) {
            var card = cards[i], tgt = targets[i];
            gsap.killTweensOf(card.userData.pos);
            gsap.killTweensOf(card.userData.rot);
            gsap.to(card.userData.pos, { x: tgt.x, y: tgt.y, z: tgt.z, duration: duration, ease: "power2.inOut", overwrite: true });
            gsap.to(card.userData.rot, { x: tgt.rotX || 0, y: tgt.rotY || 0, z: tgt.rotZ || 0, duration: duration, ease: "power2.inOut", overwrite: true });
        }
    }

    var allShapes = ["cross", "grid", "helix", "doubleHelix", "pyramid", "wave3d", "rings", "wave"];
    var currentShapeIndex = 0;

    var lastTapTime = 0;
    var firstTap = true;

    function getCardFromIntersect(obj)
    {
        while (obj) {
            if (obj.userData && obj.userData.index !== undefined) return obj;
            obj = obj.parent;
        }
        return null;
    }

    function enlargeCard(card)
    {
        gsap.killTweensOf(card.userData.pos);
        gsap.killTweensOf(card.userData.rot);

        enlargedCardData = {
            card: card,
            origPos: { x: card.userData.pos.x, y: card.userData.pos.y, z: card.userData.pos.z },
            origRot: { x: card.userData.rot.x, y: card.userData.rot.y, z: card.userData.rot.z },
            origScaleX: card.scale.x, origScaleY: card.scale.y, origScaleZ: card.scale.z,
            animStartTime: performance.now(),
            animDuration: 2000,
            restoring: false
        };
        enlargedCard = card;

        for (var j = 0; j < cards.length; j++) {
            if (cards[j] !== card) {
                gsap.killTweensOf(cards[j].material);
                gsap.to(cards[j].material, { opacity: 0.25, duration: 0.8, ease: "power2.inOut" });
            }
        }

        gsap.killTweensOf(camera);
        gsap.to(camera, {
            fov: 70,
            duration: 2,
            ease: "power2.out",
            onUpdate: function () { camera.updateProjectionMatrix(); }
        });

        console.log("[3D] Card " + card.userData.index + " enlarged");
    }

    function restoreCard()
    {
        if (!enlargedCardData) return;

        var card = enlargedCardData.card;
        enlargedCardData.restoreFromPos = { x: card.position.x, y: card.position.y, z: card.position.z };
        enlargedCardData.restoreFromRot = { x: card.rotation.x, y: card.rotation.y, z: card.rotation.z };
        enlargedCardData.restoreFromScale = { x: card.scale.x, y: card.scale.y, z: card.scale.z };
        enlargedCardData.animStartTime = performance.now();
        enlargedCardData.animDuration = 1600;
        enlargedCardData.restoring = true;
        enlargedCard = null;

        for (var j = 0; j < cards.length; j++) {
            gsap.killTweensOf(cards[j].material);
            gsap.to(cards[j].material, { opacity: 1, duration: 0.6, ease: "power2.inOut" });
        }

        gsap.killTweensOf(camera);
        gsap.to(camera, {
            fov: 55,
            duration: 1.6,
            ease: "power2.out",
            onUpdate: function () { camera.updateProjectionMatrix(); }
        });

        console.log("[3D] Card restoring");
    }

    function handleTap(e)
    {
        var now = Date.now();
        if (now - lastTapTime < 400) return;
        lastTapTime = now;

        if (enlargedCardData && enlargedCardData.restoring) return;

        if (firstTap) {
            firstTap = false;
            for (var ek = 0; ek < entranceProgresses.length; ek++) {
                gsap.killTweensOf(entranceProgresses[ek]);
            }
            gsap.killTweensOf(cameraPushObj);
            orbitControls.enabled = true;
            orbitControls.update();
            var audio = document.getElementById("bgMusic");
            if (audio) { audio.play(); }
            currentShapeIndex = 0;
            switchLayout("cross", 2);
            return;
        }

        if (e && e.type === "touchend" && e.changedTouches) {
            mouse.x = (e.changedTouches[0].clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.changedTouches[0].clientY / window.innerHeight) * 2 + 1;
        } else if (e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        }

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(cards, true);
        var clickedCard = null;
        if (intersects.length > 0) {
            clickedCard = getCardFromIntersect(intersects[0].object);
        }

        if (clickedCard && !enlargedCard) {
            var audio = document.getElementById("bgMusic");
            if (audio) { audio.play(); }
            enlargeCard(clickedCard);
            return;
        }

        if (enlargedCard) {
            restoreCard();
            return;
        }

        console.log("[3D] TAP DETECTED (layout switch)");
        var audio = document.getElementById("bgMusic");
        if (audio) { audio.play(); }
        currentShapeIndex = (currentShapeIndex + 1) % allShapes.length;
        switchLayout(allShapes[currentShapeIndex], 2);
    }

    window.addEventListener("click", handleTap);
    renderer.domElement.addEventListener("touchend", handleTap, { passive: false });
    console.log("[3D] Click + Touch handlers registered");

    var initPoker = pokerLayout();
    for (var ii = 0; ii < cards.length; ii++) {
        var ci2 = cards[ii], pi = initPoker[ii];
        ci2.userData.pos.x = pi.x;
        ci2.userData.pos.y = (ii % 2 === 0) ? 30 : -30;
        ci2.userData.pos.z = pi.z;
        ci2.userData.rot.x = pi.rotX || 0; ci2.userData.rot.y = pi.rotY || 0; ci2.userData.rot.z = pi.rotZ || 0;
        ci2.userData.pokerY = pi.y;
        ci2.position.set(pi.x, ci2.userData.pos.y, pi.z);
        ci2.rotation.set(pi.rotX || 0, pi.rotY || 0, pi.rotZ || 0);
    }

    var entranceProgresses = [];
    for (var ei = 0; ei < cards.length; ei++) {
        var card = cards[ei];
        gsap.to(card.material, {
            opacity: 1,
            duration: 1.2,
            delay: 0.3 + ei * 0.07,
            ease: "power2.out"
        });
        gsap.to(card.userData.pos, {
            y: card.userData.pokerY,
            duration: 1.2,
            delay: 0.3 + ei * 0.07,
            ease: "power2.out"
        });
    }

    var cameraPushObj = { z: 55 };
    orbitControls.enabled = false;
    gsap.to(cameraPushObj, {
        z: 30,
        duration: 4.5,
        delay: 0.3,
        ease: "power2.inOut",
        onUpdate: function () {
            camera.position.z = cameraPushObj.z;
            camera.lookAt(0, 0, 0);
        },
        onComplete: function () {
            orbitControls.enabled = true;
            orbitControls.update();
        }
    });

    var hoveredCard = null;
    renderer.domElement.addEventListener("mousemove", function (e) {
        if (enlargedCard) return;
        if (enlargedCardData && enlargedCardData.restoring) return;

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        var intersects = raycaster.intersectObjects(cards, true);
        var newHovered = null;
        if (intersects.length > 0) {
            newHovered = getCardFromIntersect(intersects[0].object);
        }

        if (hoveredCard !== newHovered) {
            if (hoveredCard) {
                gsap.to(hoveredCard.scale, { x: 1, y: 1, z: 1, duration: 0.3, ease: "power2.out", overwrite: true });
            }
            if (newHovered) {
                gsap.to(newHovered.scale, { x: 1.15, y: 1.15, z: 1.15, duration: 0.3, ease: "power2.out", overwrite: true });
            }
            hoveredCard = newHovered;
        }
    });

    function animate(timestamp) {
        requestAnimationFrame(animate);
        var time = timestamp * 0.001;
        orbitControls.update();
        var posArr = heartGeo.attributes.position.array;
        for (var hi = 0; hi < heartCount; hi++) {
            var hd = heartData[hi];
            hd.y += hd.speed * 0.018;
            if (hd.y > 22) { hd.y = -22; hd.baseX = (Math.random() - 0.5) * 55; hd.baseZ = (Math.random() - 0.5) * 55; }
            var hIdx = hi * 3;
            posArr[hIdx] = hd.baseX + Math.sin(time * hd.speed + hd.phase) * hd.amp;
            posArr[hIdx + 1] = hd.y;
            posArr[hIdx + 2] = hd.baseZ + Math.cos(time * hd.speed * 0.7 + hd.phase) * hd.amp * 0.7;
        }
        heartGeo.attributes.position.needsUpdate = true;
        for (var cj = 0; cj < cards.length; cj++) {
            var cl = cards[cj];

            if (cl === enlargedCard) {
                var cd = enlargedCardData;
                if (!cd.restoring) {
                    var elapsed = timestamp - cd.animStartTime;
                    var t = Math.min(elapsed / cd.animDuration, 1);
                    t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                    var cameraDir = new THREE.Vector3();
                    camera.getWorldDirection(cameraDir);
                    var targetPos = camera.position.clone().add(cameraDir.clone().multiplyScalar(6));

                    var orig = new THREE.Vector3(cd.origPos.x, cd.origPos.y, cd.origPos.z);
                    cl.position.lerpVectors(orig, targetPos, t);
                    cl.lookAt(camera.position);
                    cl.rotateY(Math.sin(t * Math.PI) * Math.PI * 2);

                    var targetScale = 1.8;
                    var origScale = cd.origScaleX;
                    cl.scale.setScalar(origScale + (targetScale - origScale) * t);
                }
                continue;
            }

            if (enlargedCardData && enlargedCardData.restoring && enlargedCardData.card === cl) {
                var cd = enlargedCardData;
                var elapsed = timestamp - cd.animStartTime;
                var t = Math.min(elapsed / cd.animDuration, 1);
                t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                var fromPos = new THREE.Vector3(cd.restoreFromPos.x, cd.restoreFromPos.y, cd.restoreFromPos.z);
                var toPos = new THREE.Vector3(cd.origPos.x, cd.origPos.y, cd.origPos.z);
                cl.position.lerpVectors(fromPos, toPos, t);
                cl.lookAt(camera.position);
                cl.rotateY(Math.sin(t * Math.PI) * Math.PI * 2);

                var fromScale = cd.restoreFromScale.x;
                var toScale = cd.origScaleX;
                cl.scale.setScalar(fromScale + (toScale - fromScale) * t);

                if (t >= 1) {
                    cl.position.set(cd.origPos.x, cd.origPos.y, cd.origPos.z);
                    cl.scale.set(cd.origScaleX, cd.origScaleY, cd.origScaleZ);
                    enlargedCardData = null;
                }
                continue;
            }

            var p = cl.userData.pos;
            var ph = cl.userData.phase, sp = cl.userData.speed;
            cl.position.set(
                p.x + Math.cos(time * sp * 0.7 + ph) * 0.12,
                p.y + Math.sin(time * sp + ph) * 0.15,
                p.z + Math.sin(time * sp * 0.5 + ph) * 0.1
            );
            cl.lookAt(camera.position);
        }
        renderer.render(scene, camera);
    }

    window.addEventListener("resize", function () {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    console.log("[3D] Starting animation loop...");
    requestAnimationFrame(animate);
    console.log("[3D] IIFE complete");
})();
</script>
